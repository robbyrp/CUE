spring:
  # Reads backend/.env (gitignored) as plain KEY=VALUE properties, same file
  # docker compose already loads for the db container. "optional:" means the
  # app still starts fine in CI, where the real values come from env vars
  # instead of a .env file.
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: cue
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:cue_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
logging:
    level:
      org:
        hibernate:
          SQL: INFO
          orm:
            jdbc:
              bind: INFO
security:
  jwt:
    # No fallback on purpose: the app must fail to start rather than silently
    # sign tokens with a default/well-known key. Set JWT_SECRET_KEY in the
    # environment (see .env.example).
    secret-key: ${JWT_SECRET_KEY}