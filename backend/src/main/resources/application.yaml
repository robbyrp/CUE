spring:
  application:
    name: cue
  datasource:
    url: jdbc:postgresql://localhost:5432/cue_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
logging:
    level:
      org:
        hibernate:
          SQL: DEBUG
          orm:
            jdbc:
              bind: TRACE
