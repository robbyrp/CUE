name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-verify:
    name: Build & test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run unit tests (Surefire, *Test.java)
        run: ./mvnw -B test

      # Testcontainers pulls postgres:15 itself; ubuntu-latest ships Docker
      # already running, so no extra service/container setup is needed here.
      # Classes are already compiled by the `test` step above, so this only
      # needs to invoke the Failsafe goals directly, not the full `verify`
      # lifecycle (which would re-run Surefire's unit tests too).
      - name: Run integration tests (Failsafe + Testcontainers, *IT.java)
        run: ./mvnw -B failsafe:integration-test failsafe:verify
