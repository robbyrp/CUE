name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-verify:
    name: Build & test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Testcontainers pulls postgres:15 itself; ubuntu-latest ships Docker
      # already running, so no extra service/container setup is needed here.
      - name: Build and run tests (unit + Testcontainers integration)
        run: ./mvnw -B verify
